<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"></head><body class="pml" style="margin:0;padding:16px;background:var(--surface-inset)">
<div class="pml-window" style="box-shadow:none"><div class="pml-layout"><div class="pml-rail"><p class="pml-eyebrow">What are you trying to do?</p><div class="pml-modes" role="tablist"><button class="pml-mode" role="tab" aria-selected="false"><span class="pml-mode-icon" data-icon="reply"></span><span><span style="display:block">Reply</span><span class="pml-mode-hint">Answer a message you got</span></span></button><button class="pml-mode" role="tab" aria-selected="true"><span class="pml-mode-icon" data-icon="write"></span><span><span style="display:block">Write</span><span class="pml-mode-hint">Say something new, polished</span></span></button><button class="pml-mode" role="tab" aria-selected="false"><span class="pml-mode-icon" data-icon="understand"></span><span><span style="display:block">Understand</span><span class="pml-mode-hint">Make sense of a message</span></span></button><button class="pml-mode" role="tab" aria-selected="false"><span class="pml-mode-icon" data-icon="ask"></span><span><span style="display:block">Ask</span><span class="pml-mode-hint">Get advice on tone or wording</span></span></button></div><button class="pml-gear">Settings</button></div>
<div class="pml-col"><h2 class="pml-title">Write</h2><p class="pml-sub">Tell me what you need to say. Get a clear draft in the voice you pick.</p>
<div class="pml-field"><textarea class="pml-input" placeholder="Copy some text, then press ⇧⌘W — or paste it here."></textarea></div>
<div class="pml-chips"><button class="pml-chip" role="option" aria-selected="true"><span>🤴</span>Like Brit.<span class="pml-chip-blurb">Casual Teams message, native English</span></button><button class="pml-chip" role="option" aria-selected="false"><span>🫆</span>Like Me<span class="pml-chip-blurb">Still sounds like me</span></button></div>
<div style="font-size:12px;color:var(--ink-muted)">› <b style="color:var(--ink)">Prompt</b> &nbsp;·&nbsp; Tone <b style="color:var(--ink)">Casual</b></div>
<div><button class="pml-btn" style="width:100%" disabled>Send <span class="pml-kbd">⌘↵</span></button></div>
<div class="pml-output"><div class="pml-output-empty">Your draft appears here.<br>Pick a preset above, then press ⌘↵.</div></div></div></div>
<div style="margin-top:20px;padding-top:10px;border-top:1px solid var(--divider);font-size:11.5px;color:var(--ink-muted);display:flex;gap:10px">Version 1.2.0 <span>·</span> <span style="color:var(--accent-text)">Send feedback</span></div></div>
<script>const ICONS={reply:'<polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',write:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',understand:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',ask:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'};
document.querySelectorAll("[data-icon]").forEach(e=>{e.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[e.dataset.icon]+'</svg>'});</script></body></html>
