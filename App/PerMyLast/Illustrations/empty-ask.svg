<svg xmlns="http://www.w3.org/2000/svg" width="240" height="132" viewBox="0 0 240 132" role="img" aria-label="An empty hammock tied between two leaning palm trunks at sunset">
<style>
@keyframes eswing{0%,100%{transform:rotate(-0.8deg)}50%{transform:rotate(0.8deg)}}
@keyframes esfrondL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.5deg)}}
@keyframes esfrondR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2.5deg)}}
@keyframes esbird{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-2px)}}
.swing{transform-origin:120px 56px;animation:eswing 4s ease-in-out infinite}
.frondL{transform-origin:4px -4px;animation:esfrondL 5s ease-in-out infinite}
.frondR{transform-origin:236px -4px;animation:esfrondR 5.4s ease-in-out infinite}
.bird{animation:esbird 6s ease-in-out infinite}
.bird2{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){.swing,.frondL,.frondR,.bird{animation:none}}
</style>
